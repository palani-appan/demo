name: Testing Configuration Variables
on: 
  workflow_dispatch

env:
 cloud: google-cloud
jobs:
   greeting_job:
    runs-on: ubuntu-latest
    env:
     Greeting: Hello
    steps:
     - name: "Say Hello its Monday"
       run: echo "$Greeting $First_name is using $cloud! with project ${{vars.PROJECT_ID}}"
       env:
        First_name: Palaniappan
